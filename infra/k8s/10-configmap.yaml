# Configuracion NO sensible. Todo lo que sea secreto va en el Secret
# (20-secret.example.yaml), nunca aca: un ConfigMap se lee con permisos de
# lectura basicos del namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: turnos-config
  namespace: turnos-platform
data:
  # Los servicios de datos son gestionados (RDS y ElastiCache), no viven en
  # el cluster: para un SLA de 99.9% el backup, el failover y los parches
  # los maneja AWS. Reemplazar estos hosts por los endpoints reales.
  #
  # OJO: DATABASE_URL trae la contrasenia, asi que NO va aca -- se arma
  # entera en el Secret. Este ConfigMap solo lleva lo que se puede mostrar.
  NODE_ENV: 'production'
  # Origenes desde los que se acepta al panel. En produccion es OBLIGATORIA:
  # si falta, el servicio no arranca (packages/http/src/cors.util.ts). Un
  # comodin en un servicio que recibe el token por header Authorization
  # dejaria que cualquier sitio hiciera llamadas autenticadas desde el
  # navegador de un usuario logueado.
  CORS_ORIGINS: 'https://turnos.REEMPLAZAR.com'
  # Zona horaria del taller: horario laboral, corte de dias de agenda y
  # dashboard, y hora de los recordatorios. Tiene que coincidir con el
  # --build-arg VITE_TZ_NEGOCIO de la imagen de admin-web.
  TZ_NEGOCIO: 'America/Bogota'
  # Proxies delante de los servicios (el ALB = 1). usuarios-service guarda la
  # IP de cada aceptacion de un documento legal (Sprint 23): sin esto queda
  # la del balanceador. Un numero y no 'true': con 'true' Express toma la
  # IP que escribe el cliente en X-Forwarded-For (packages/http/src/proxy.util.ts).
  TRUST_PROXY: '1'
  # Pagos (Sprint 24). WEB_URL: a donde vuelve el cliente desde el checkout
  # de Wompi (/pagos/resultado). RESERVAS_URL_PUBLICA: con la que Wompi
  # llega al webhook; el panel la muestra para pegarla en Wompi. HTTPS.
  WEB_URL: 'https://turnos.REEMPLAZAR.com'
  RESERVAS_URL_PUBLICA: 'https://api.REEMPLAZAR.com'
  JWT_EXPIRES_IN: '15m'
  JWT_REFRESH_EXPIRES_IN: '7d'
  NOTIFICACIONES_INTENTOS: '3'
  NOTIFICACIONES_BACKOFF_MS: '5000'
  SENDGRID_FROM_EMAIL: 'no-reply@turnos-platform.dev'
  TWILIO_WHATSAPP_FROM: '+14155238886'
