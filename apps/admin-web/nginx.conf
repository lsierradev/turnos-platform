server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # SPA: cualquier ruta que no sea un archivo real la resuelve el router de
    # React. Sin esto, recargar estando en /dashboard devuelve 404 de nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets llevan hash en el nombre (vite), asi que se pueden cachear
    # para siempre. index.html NO: es el que apunta a los assets nuevos en
    # cada deploy, y si el navegador lo cachea sigue pidiendo los viejos.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Health para los probes de Kubernetes. nginx sirviendo estaticos no
    # tiene dependencias que chequear, asi que liveness y readiness son lo
    # mismo: que el proceso responda.
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;
}
