<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#030712" media="(prefers-color-scheme: dark)" />
    <title>turnos-platform admin</title>
    <!--
      Aplica el tema antes del primer pintado, para que el modo oscuro no
      arranque con un destello blanco. Misma clave y logica que
      src/lib/tema.tsx: si se cambia una, cambiar la otra.
    -->
    <script>
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem('turnos-tema');
        } catch (e) {}
        var oscuro =
          pref === 'oscuro' ||
          (pref !== 'claro' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (oscuro) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
