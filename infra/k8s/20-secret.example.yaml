# PLANTILLA. No aplicar tal cual y NO commitear la version con valores.
#
#   cp 20-secret.example.yaml /tmp/secret.yaml   # fuera del repo
#   # completar los valores
#   kubectl apply -f /tmp/secret.yaml
#
# JWT_SECRET tiene que ser IDENTICO en los dos servicios: usuarios-service
# firma los access tokens y reservas-service los valida. Si se desalinean, el
# login funciona y despues toda llamada a reservas devuelve 401.
#
# Si alguna de estas variables falta, el servicio NO ARRANCA en produccion
# (packages/auth/src/secretos.util.ts). Es deliberado: sin ellas firmaria
# tokens con el secreto de desarrollo, que esta publicado en este repo.
#
# ENCRYPTION_KEY debe ser hexadecimal de 64 caracteres (32 bytes). Generar:
#   openssl rand -hex 32
# Cambiarla despues de tener datos hace ILEGIBLES los telefonos ya cifrados:
# no es rotable sin un proceso de re-cifrado.
#
# Cuando el cluster tenga External Secrets Operator, este Secret se
# reemplaza por un ExternalSecret que lo sincroniza desde AWS Secrets
# Manager, y deja de existir como archivo. Ver infra/k8s/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: turnos-secrets
  namespace: turnos-platform
type: Opaque
stringData:
  DATABASE_URL: 'postgres://USUARIO:PASSWORD@turnos-db.xxxxx.us-east-1.rds.amazonaws.com:5432/turnos_platform'
  REDIS_URL: 'redis://turnos-cache.xxxxx.ng.0001.use1.cache.amazonaws.com:6379'
  JWT_SECRET: 'REEMPLAZAR'
  JWT_REFRESH_SECRET: 'REEMPLAZAR'
  ENCRYPTION_KEY: 'REEMPLAZAR-64-HEX'
  SENDGRID_API_KEY: 'REEMPLAZAR'
  TWILIO_ACCOUNT_SID: 'REEMPLAZAR'
  TWILIO_AUTH_TOKEN: 'REEMPLAZAR'
