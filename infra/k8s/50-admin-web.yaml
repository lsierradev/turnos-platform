apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-web
  namespace: turnos-platform
  labels:
    app.kubernetes.io/name: admin-web
    app.kubernetes.io/part-of: turnos-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-web
    spec:
      securityContext:
        runAsNonRoot: true
        # uid del usuario nginx en nginxinc/nginx-unprivileged.
        runAsUser: 101
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
      containers:
        - name: admin-web
          # La URL de la API va HORNEADA en el bundle (vite resuelve
          # VITE_API_URL en tiempo de build), asi que esta imagen sirve para
          # UN SOLO entorno. La de staging no se puede promover a produccion:
          # hay que reconstruirla con el VITE_API_URL correcto. Ver el
          # Dockerfile de admin-web y docs/GO-LIVE.md.
          image: ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/turnos-platform/admin-web:REEMPLAZAR
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          # nginx necesita escribir su cache y su pid aunque solo sirva
          # estaticos; con readOnlyRootFilesystem hay que darle estos dos.
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          # nginx sirviendo estaticos no tiene dependencias externas que
          # comprobar, asi que liveness y readiness son lo mismo: que el
          # proceso responda.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: admin-web
  namespace: turnos-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: admin-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: admin-web
  namespace: turnos-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-web
